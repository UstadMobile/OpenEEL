appId: org.openeel.app
tags:
  - 001_004
onFlowStart:
  - clearState: org.openeel.app
  - runScript:
      file: "scripts/school_init.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
        SCHOOL_ADMIN_PASSWORD: ${SCHOOL_ADMIN_PASSWORD}
        DIR_ADMIN_AUTH_HEADER: ${DIR_ADMIN_AUTH_HEADER}
        SCHOOL_URL: ${SCHOOL_URL}
        SCHOOL_NAME: ${SCHOOL_NAME}
        URL_SUBSTITUTION: ${URL_SUBSTITUTION}
        NAME: "001_004_shared_device_test.yaml"

onFlowComplete:
  - runFlow:
      file: "subflows/teardown.yaml"
      env:
        NAME: "db-final"
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}

---
## Admin setup
- runFlow: "subflows/school_admin_login_flow.yaml"

# Add class, then add Student and Teacher to class
- runFlow:
     file: "subflows/admin_add_class.yaml"
     env:
       CLASSNAME: "TestClass"
- runFlow:
    file: "subflows/add_person_to_a_class.yaml"
    env:
      ADD_USER: "Add Student"
      FIRSTNAME: "StudentA"
      LASTNAME:  "User"
      GENDER: "Male"
      CLASSNAME: "TestClass"
      USERNAME: "studentauser"
      PASSWORD: "test123"
      QR_BADGE_LINK: ${output.SCHOOL_URL}respect_school_link/personqrbadge/id/12312
- assertVisible: "Manage account"
- assertVisible:
    id: "qr_change_btn"
- back
- runFlow:
    file: "subflows/add_person_to_a_class.yaml"
    env:
      ADD_USER: "Add Teacher"
      FIRSTNAME: "TeacherA"
      LASTNAME:  "User"
      GENDER: "Male"
      CLASSNAME: "TestClass"
      USERNAME: "teacherauser"
      PASSWORD: "test123"
# Add Family member to Student profile
- tapOn: "People"
- tapOn: "StudentA User"
- tapOn:
    id: "floating_action_button"
- tapOn: "Family member"
- tapOn: "Add person"
- tapOn: "First names*"
- inputText: "Parent"
- tapOn: "Last name*"
- inputText: "User"
- tapOn: "Gender*"
- tapOn: "Male"
- tapOn: "Save"
- assertVisible: "Parent User"
- tapOn: "Save"
- assertVisible:
    id: "app_title"
    text: "StudentA User"
- tapOn: "Parent User"
# Create account for Parent user  -- only username and password fields available for parent user
- tapOn: "Create account"
- assertVisible:
    id: "app_title"
    text: "Create account"
- assertVisible:
    id: "Username"
    text: "parentuser"
- tapOn: "Password*"
- inputText: "test123"
- tapOn: "Save"
- tapOn:
    id: "nav_home"
- assertVisible:
    id: "app_title"
    text: "Home"
# Add app
- runFlow: "subflows/admin_add_app.yaml"

# Add an assignment
- runFlow: "subflows/admin_add_class_and_assignment.yaml"

# Enable Shared Mode - Test Device 1
- tapOn:
    id: "nav_home"
- assertVisible:
    id: "app_title"
    text: "Home"
- tapOn:
    id: "Settings"
- assertVisible:
    id: "app_title"
    text: "Settings"
- assertVisible: "School name, policies, shared device"
- tapOn: "School"
- assertVisible:
    id: "app_title"
    text: "School"
- assertVisible: "School name"
- assertVisible: ${output.SCHOOL_NAME}
- assertVisible: "Shared school device"
- assertVisible: "0 devices"
- tapOn: "Shared school device"
- assertVisible:
    id: "app_title"
    text: "Shared school device"
- assertVisible: "No Shared Devices Available"
- assertVisible: "Shared school devices allow multiple users to securely access the app on the same device using their profile"
- assertVisible: "Student can self-select their class and name"
- assertVisible: "Teacher/admin unlock PIN"
- copyTextFrom:
    id: "set_pin"
- tapOn:
    id: "set_pin"
- assertVisible: "Set PIN"
- inputText: "123"
- tapOn: "Save"
- assertVisible: "Error: please enter 4 digit number"
- eraseText
- inputText: "123a"
- tapOn: "Save"
- assertVisible: "Error: please enter 4 digit number"
- tapOn: "Cancel"
- assertVisible: ${maestro.copiedText}
- tapOn:
    id: "set_pin"
- assertVisible: "Set PIN"
- inputText: "1234"
- tapOn: "Save"
- assertVisible:
    id: "app_title"
    text: "Shared school device"
- assertVisible: "1234"

# Enable This Device
- tapOn:
    id: "floating_action_button"
- assertVisible: "Add device"
- assertVisible: "This device"
- assertVisible: "Enable shared school device on mode on this device"
- assertVisible: "Another device"
- assertVisible: "Add using QR code, link, or invite code"
- tapOn: "This device"
- assertVisible:
    id: "app_title"
    text: "Enable shared school device mode"
- tapOn: "Enable"
- assertVisible: "Required field*" #mandatory field error
- tapOn:
    text: "Device name *"
- inputText: "Test Device 1"
- hideKeyboard
- assertVisible: "Enable"
- tapOn: "Enable"
- assertVisible:
    id: "app_title"
    text: "Select class"
- assertVisible: "TestClass"
- assertVisible: "Scan QR code badge"

# Enable Test Device 1
- tapOn: "Teacher/admin login"
