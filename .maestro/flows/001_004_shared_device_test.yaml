- tapOn:
    id: "Settings"
- assertVisible:
    id: "app_title"
    text: "Settings"
- tapOn: "School"
- assertVisible:
    id: "app_title"
    text: "School"
- assertVisible: "School name"
- assertVisible: ${output.SCHOOL_NAME}
- assertVisible: "Shared school device"
- assertVisible: "1 devices"
