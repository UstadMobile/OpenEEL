appId: org.openeel.app
tags:
  - 003
onFlowStart:
  - clearState: org.openeel.app
  - runScript:
      file: "scripts/school_init.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
        SCHOOL_ADMIN_PASSWORD: ${SCHOOL_ADMIN_PASSWORD}
        DIR_ADMIN_AUTH_HEADER: ${DIR_ADMIN_AUTH_HEADER}
        SCHOOL_URL: ${SCHOOL_URL}
        URL_SUBSTITUTION: ${URL_SUBSTITUTION}
        NAME: "003_admin_user_assigns_assignment_to_a_class_test"

onFlowComplete:
  - runFlow:
      file: "subflows/teardown.yaml"
      env:
        NAME: "db-final"
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
---
- runFlow: "subflows/school_admin_login_flow.yaml"
- runFlow: "subflows/admin_add_app.yaml"
- runFlow:
    file:  "subflows/admin_add_class_with_members.yaml"
    env:
      CLASSNAME: "TestClass"

# Teacher Add Assignment
- runFlow:
    file: "subflows/e2e_artifact_upload.yaml"
    env:
      NAME: "db-admin-class-setup"
- clearState: org.openeel.app
- runFlow:
    file: "subflows/school_user_login_flow.yaml"
    env:
      USERNAME: "teacherauser"
      PASSWORD: "test123"
- assertVisible:
        id: "nav_home"
- tapOn: "Classes"
- assertVisible:
    id: "app_title"
    text: "Classes"
- assertVisible: "TestClass"
- tapOn: "Assignments"
- tapOn:
    id: "floating_action_button"   #  +Assignment button
- assertVisible:
    id: "app_title"
    text: "Add assignment"
- tapOn: "Save"
- assertVisible: "Required field"
- tapOn: "Assignment title*"
- inputText: "Homework 1"
- tapOn: "Assign to"
- tapOn: "TestClass"
- tapOn: "Description"
- inputText: "Please complete this Homework on time."
- runFlow:
    when:
      notVisible: "Due date"
    commands:
      - hideKeyboard
- tapOn: "Due date"
- runScript:
    file: "scripts/setDate.js"
- inputText: ${output.futureDate}
- tapOn: "Time"
- runScript:
    file: "scripts/setDate.js"
- inputText: ${output.currentTime}
- runFlow:
    when:
      notVisible: "Task"
    commands:
      - hideKeyboard
- tapOn: "Task"
- assertVisible:
    id: "app_title"
    text: "Home"
- tapOn: "Demo Launchable App"
- assertVisible:
    id: "app_title"
    text: "Demo Launchable App Lessons"
- tapOn: "Grade 1"
- tapOn: "Lesson 1 - Grade 1"
- tapOn: "Task"
- assertVisible:
    id: "app_title"
    text: "Home"
- tapOn: "Demo Launchable App"
- assertVisible:
    id: "app_title"
    text: "Demo Launchable App Lessons"
- tapOn: "Grade 1"
- tapOn: "Lesson 3 - Grade 1"
- tapOn: "Save"
- assertVisible:
    id: "app_title"
    text: "Homework 1"
- assertVisible: "All (3)"
- assertVisible: "Completed (0)"
- assertVisible: "In-progress (0)"
- assertVisible: "Please complete this Homework on time."
- assertVisible: "Assigned to"
- assertVisible: "TestClass.*"
- assertVisible: "StudentA User"
- assertVisible: "StudentB User"
- assertVisible: "StudentC User"
- assertVisible: "Lesson 1 - Grade 1"
- assertVisible: "Lesson 3 - Grade 1"
- assertVisible: "Average"
- tapOn: "Assignments"
- assertVisible:
    id: "app_title"
    text: "Assignments"
- assertVisible: "Homework 1"

- runFlow:
    file: "subflows/e2e_artifact_upload.yaml"
    env:
      NAME: "db-teacher-assigned"
- clearState: org.openeel.app
- runFlow:
    file: "subflows/school_user_login_flow.yaml"
    env:
      USERNAME: "studentauser"
      PASSWORD: "test123"
- tapOn: "Assignments"
- tapOn: "Homework 1"
- assertVisible:
    id: "app_title"
    text: "Homework 1"
- tapOn: "Lesson 1 - Grade 1"
- assertVisible:
    text: "Lesson 1 - Grade 1"
- tapOn: "Open"
- assertVisible: "Lesson 1 - Grade 1"
- tapOn: "Scaled score (must be between 0 and 1):"
- inputText: 0.9
- hideKeyboard
- retry:
    maxRetries: 3
    commands:
      - tapOn: "Send result statement"
      - assertVisible: "Statement sent.*"
- tapOn: "Close"
- back
- tapOn: "Lesson 3 - Grade 1"
- tapOn: "Open"
- assertVisible: "Lesson 3 - Grade 1"
- tapOn: "Scaled score (must be between 0 and 1):"
- inputText: 1
- hideKeyboard
- retry:
    maxRetries: 3
    commands:
      - tapOn: "Send result statement"
      - assertVisible: "Statement sent.*"
- tapOn: "Close"
- tapOn: "Assignments"
- tapOn: "Homework 1"
- assertVisible: "All (2)"
- assertVisible: "Completed (2)"
- assertVisible: "In-progress (0)"

# Student B user complete 1 task
- runFlow:
    file: "subflows/e2e_artifact_upload.yaml"
    env:
      NAME: "db-student-a-completed"
- clearState: org.openeel.app
- runFlow:
    file: "subflows/school_user_login_flow.yaml"
    env:
      USERNAME: "studentbuser"
      PASSWORD: "test123"
- tapOn: "Assignments"
- tapOn: "Homework 1"
- assertVisible:
    id: "app_title"
    text: "Homework 1"
- assertVisible: "Lesson 1 - Grade 1"
- tapOn: "Lesson 3 - Grade 1"
- tapOn: "Open"
- assertVisible: "Lesson 3 - Grade 1"
- tapOn: "Scaled score (must be between 0 and 1):"
- inputText: 1
- hideKeyboard
- retry:
    maxRetries: 3
    commands:
      - tapOn: "Send result statement"
      - assertVisible: "Statement sent.*"
- tapOn: "Close"
- tapOn: "Assignments"
- tapOn: "Homework 1"
- assertVisible: "All (2)"
- assertVisible: "Completed (1)"

# Teacher Validate students results
- runFlow:
    file: "subflows/e2e_artifact_upload.yaml"
    env:
      NAME: "db-student-b-completed"
- clearState: org.openeel.app
- runFlow:
    file: "subflows/school_user_login_flow.yaml"
    env:
      USERNAME: "teacherauser"
      PASSWORD: "test123"
- tapOn: "Assignments"
- assertVisible: "Homework 1"
- assertVisible: "TestClass.*"
- tapOn: "Homework 1"
- assertVisible: "All (3)"
- assertVisible: "Completed (1)"
- assertVisible: "In-progress (1)"
- assertVisible: "Please complete this Homework on time."
- assertVisible: "Assigned to"
- assertVisible: "TestClass.*"
- assertVisible: "StudentA User"
- assertVisible: "StudentB User"
- assertVisible: "StudentC User"
- assertVisible: "Lesson 1 - Grade 1"
- assertVisible: "Average"
- assertVisible: "95%"
- assertVisible: "100%"
- tapOn: "90%"   #Lesson 1 - Grade 1
- assertVisible:
    id: "app_title"
    text: ": StudentA User"
- assertVisible: "Passed"
- assertVisible: "Score: 90%"
- tapOn: "Score: 90%"
- assertVisible: "Timestamp:"
- assertVisible: "Verb:"
- assertVisible: "Passed"
- assertVisible: "Object:"
- assertVisible: "Name: "
- assertVisible: "Actor:"
- assertVisible: "Name: StudentA User"
- assertVisible: "Account homepage: ${output.SCHOOL_URL}"
- assertVisible: "Account name:.*"
- assertVisible: "Result:"
- assertVisible: "Score (scaled): 90%"
- tapOn:
    id: "more_options"
- tapOn: "Show raw xAPI (advanced)"
- assertVisible:
    id: "app_title"
    text: "Raw statement"
# Verify edit assignment is working
- tapOn: "Assignments"
- tapOn: "Homework 1"
- assertVisible:
    id: "app_title"
    text: "Homework 1"
- tapOn:
    id: "floating_action_button"   #  Edit button
- assertVisible:
    id: "app_title"
    text: "Edit assignment"
- tapOn: "Assignment title*"
- runFlow:
    file: "subflows/erase_text.yaml"
    env:
      TEXT: "Homework 1"
- inputText: "HW - Week 1"
- tapOn: "Save"
- assertVisible: "HW - Week 1"


