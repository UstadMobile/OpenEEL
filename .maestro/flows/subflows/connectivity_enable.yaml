appId: org.openeel.app

---
# Wait for element indicating connectivity is restored, see:
# https://github.com/UstadMobile/OpenEEL/tree/main/.maestro#onlineoffline-scenarios
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible:
      id: "connectivity_connected"
      optional: true
      label: "Wait for connectivity to be restored but don't fail because sometimes Maestro fails to find the element even though connectivity is enabled"
    timeout: 10000