appId: org.openeel.app
---
- setAirplaneMode: disabled
# Wait for all pending remote writes to complete. See AppBar.kt for note on this.
- assertVisible:
    id: "pending_write_count"
    text: "0"
- stopApp
- openLink: "org.openeel.app.e2eartifactupload:///?schoolUrl=${output.SCHOOL_URL_ENCODED}&name=${NAME}"

- extendedWaitUntil:
    visible:
      id: "upload_done"
    timeout: 30000
- takeScreenshot:
    path: e2e_artifact_upload
    label: Screenshot of E2E artifact upload result
