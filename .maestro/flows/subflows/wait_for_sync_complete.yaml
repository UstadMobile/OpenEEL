appId: org.openeel.app

---
# https://github.com/UstadMobile/OpenEEL/blob/ffe220ba8892840ed953101d55090feb9a8f3f0b/.maestro/README.md#onlineoffline-scenarios
#AppBar.kt has an invisible text with the test tag sync_pending which will be either 0 or 1. So to wait for sync to complete.
- extendedWaitUntil:
    visible:
      id: "sync_pending"
      text: "0"
    timeout: 10000