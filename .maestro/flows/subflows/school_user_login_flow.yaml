appId: org.openeel.app

---
- launchApp:
      arguments:
          respect_directory: ${output.SCHOOL_URL}

- tapOn: "Get Started"

- runFlow:
    file: "get_started_select_school_by_link.yaml"
    env:
      SCHOOL_URL: ${output.SCHOOL_URL}

- tapOn:
      id: "username"
- inputText: ${USERNAME}
- tapOn:
      id : "password"
- inputText: ${PASSWORD}
- tapOn: "Login"
- runFlow:
    when:
      visible: "Save password for Respect?"
    file: "save_password_prompt_cancel.yaml"

